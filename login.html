<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to the Sports Team Portal demo.">
    <title>Login | Sports Team Portal</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Sports Team Portal</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="login.html" aria-current="page">Login</a>
        <a href="signup.html">Register</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="profile.html">Profile</a>
      </nav>
    </header>
    <main class="page page-narrow">
      <section class="page-heading">
        <h1>Welcome back</h1>
        <p class="muted">Sign in form demonstration for the sports team portal.</p>
      </section>
      <form class="form-card" id="login-form">
        <label for="username">Username
          <input id="username" name="username" type="text" autocomplete="username" required>
        </label>
        <label for="password">Password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="actions">
          <button type="submit">Log in</button>
          <a href="signup.html">Create an account</a>
        </div>
        <p class="status muted" id="login-message" role="status" aria-live="polite"></p>
      </form>
      <p class="notice">Demo only: no password is checked or sent to a server. Do not enter a real password.</p>
    </main>
    <footer class="site-footer">Sports Team Portal · Project demonstration</footer>
    <script>
      document.querySelector("#login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#login-message").textContent =
          "Form submitted for demonstration. Authentication is not connected.";
      });
    </script>
  </body>
</html>
